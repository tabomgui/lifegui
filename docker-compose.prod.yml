# Stack de produção single-origin do lifegui (usada pelo install.sh).
# web (nginx) serve o SPA e faz proxy de /api, /sanctum, /mcp, /oauth, /.well-known
# e /up pro backend Laravel. TLS, quando houver, termina num proxy/túnel externo.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lifegui}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # .env fica fora da imagem (.dockerignore) — montado aqui pra key:generate persistir.
    volumes:
      - ./backend/.env:/var/www/html/.env
      # Vaults Obsidian do módulo Cérebro (um por usuário, {user_id}/).
      - ${VAULTS_PATH_HOST:-./vaults}:/vaults
      # Chaves OAuth do Passport (servidor MCP): fora da imagem pra rebuild
      # não invalidar os tokens dos clientes conectados.
      - ./oauth-keys:/var/www/html/storage/oauth
    # Resolvers públicos: alguns DNS de roteador doméstico são intermitentes e
    # derrubam chamadas a hosts externos (ex.: OAuth do Google). Nomes de
    # serviço (mysql) continuam resolvidos pelo DNS embutido do Docker.
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-lifegui}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      VAULTS_PATH: /vaults
    # Gera APP_KEY/chaves do Passport se faltarem, roda migrations e sobe o servidor.
    command: sh -c "(grep -q '^APP_KEY=base64' .env || php artisan key:generate --force) && ([ -f storage/oauth/oauth-private.key ] || php artisan passport:keys) && php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    # A imagem alpine não tem curl: o próprio PHP consulta o /up do Laravel.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${LIFEGUI_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
