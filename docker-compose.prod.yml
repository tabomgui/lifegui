# Stack de produção single-origin do lifegui — atrás do Cloudflare Tunnel (termina TLS).
# web (nginx) serve o SPA na :80 e faz proxy de /api e /sanctum pro backend Laravel.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lifegui}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    # .env fica fora da imagem (.dockerignore) — montado aqui pra key:generate persistir.
    volumes:
      - ./backend/.env:/var/www/html/.env
      # Vaults Obsidian do módulo Cérebro (um por usuário, {user_id}/).
      # Fonte da verdade em arquivos .md; a pasta no host é a futura raiz do sync.
      - ${VAULTS_PATH_HOST:-./vaults}:/vaults
    # Resolvers públicos: o DNS do roteador (192.168.1.1) é intermitente e causava
    # timeout ao resolver hosts externos (ex.: OAuth do Google). Nomes de serviço
    # (mysql) continuam via DNS embutido do Docker.
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-lifegui}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      VAULTS_PATH: /vaults
    # Gera APP_KEY se faltar, roda migrations e sobe o servidor.
    command: sh -c "(grep -q '^APP_KEY=base64' .env || php artisan key:generate --force) && php artisan config:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
