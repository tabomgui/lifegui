<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="badge"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>

  <!-- background -->
  <circle cx="32" cy="32" r="31" fill="#F5ECDD"/>

  <g clip-path="url(#badge)" stroke="#2E2620" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- hoodie / shoulders -->
    <path d="M4 64 C4 50 16 45 24 45 L40 45 C48 45 60 50 60 64 Z" fill="#2C313A"/>
    <!-- hood collar -->
    <path d="M23 45 C25 52 39 52 41 45 L41 41 L23 41 Z" fill="#3A414C"/>

    <!-- neck -->
    <path d="M26 40 L26 47 C26 50 38 50 38 47 L38 40 Z" fill="#E6B084"/>

    <!-- ears -->
    <ellipse cx="16.5" cy="31" rx="3.2" ry="4.2" fill="#F1C39C"/>
    <ellipse cx="47.5" cy="31" rx="3.2" ry="4.2" fill="#F1C39C"/>

    <!-- face -->
    <path d="M17 27 C17 15 24 9 32 9 C40 9 47 15 47 27 C47 37 41 44 32 44 C23 44 17 37 17 27 Z" fill="#F4CBA6"/>

    <!-- hair -->
    <path d="M15 30
             C12 20 12 12 19 8
             C18 5 20 4 22 5
             C22 3 25 3 26 5
             C27 2 31 3 32 5
             C34 3 38 4 39 7
             C46 9 50 16 48 27
             C47 24 46 22 43 21
             C41 24 37 25 32 25
             C27 25 23 24 21 21
             C18 23 16 26 15 30 Z" fill="#E8C77F"/>
    <!-- hair strand accents -->
    <path d="M22 6 C24 9 26 10 29 10" fill="none" stroke="#C9A758" stroke-width="1"/>
    <path d="M33 6 C35 9 38 11 42 12" fill="none" stroke="#C9A758" stroke-width="1"/>

    <!-- eyebrows -->
    <path d="M21 24 C24 22 27 22 29 23" fill="none" stroke-width="1.6"/>
    <path d="M35 23 C37 22 40 22 43 24" fill="none" stroke-width="1.6"/>

    <!-- glasses -->
    <g fill="#F7FAFC" fill-opacity="0.25">
      <rect x="18" y="25" width="12" height="10" rx="3.5" stroke="#17181B" stroke-width="2"/>
      <rect x="34" y="25" width="12" height="10" rx="3.5" stroke="#17181B" stroke-width="2"/>
    </g>
    <path d="M30 29 L34 29" stroke="#17181B" stroke-width="2"/>
    <path d="M18 28 L15 27" stroke="#17181B" stroke-width="2"/>
    <path d="M46 28 L49 27" stroke="#17181B" stroke-width="2"/>

    <!-- eyes -->
    <circle cx="24" cy="30.5" r="2" fill="#241C16" stroke="none"/>
    <circle cx="40" cy="30.5" r="2" fill="#241C16" stroke="none"/>
    <circle cx="24.7" cy="29.8" r="0.6" fill="#fff" stroke="none"/>
    <circle cx="40.7" cy="29.8" r="0.6" fill="#fff" stroke="none"/>

    <!-- nose -->
    <path d="M31 33 C30 36 31 37 33 37" fill="none" stroke-width="1.2"/>

    <!-- open smile -->
    <path d="M25 39 C28 45 37 45 40 39 C36 41 29 41 25 39 Z" fill="#8A3A3A"/>
    <path d="M25 39 C29 40 36 40 40 39 C36 38 29 38 25 39 Z" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- badge ring -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#2E2620" stroke-width="1.5" stroke-opacity="0.25"/>
</svg>
