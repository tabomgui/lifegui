# Chave fixa ($server_name), não por IP: a rajada no /mcp vem de dezenas de
# IPs distintos (infra do conector) — limitar por IP não protegeria o agregado.
limit_req_zone $server_name zone=mcp_burst:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # API + Sanctum + OAuth + discovery + health vão pro pool www do backend
    # (mesmo origin, sem CORS).
    location ~ ^/(api|sanctum|oauth|\.well-known|up) {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Servidor MCP (streamable HTTP): pool isolado do backend (porta 9001),
    # pra rajada de MCP não comer os workers do pool www. Buffering desligado
    # pra resposta em streaming.
    location /mcp {
        limit_req zone=mcp_burst burst=10 nodelay;
        include fastcgi_params;
        fastcgi_pass backend:9001;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
