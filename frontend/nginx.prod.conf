server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # API + Sanctum vão pro backend Laravel (mesmo origin, sem CORS).
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host; # nosemgrep: request-host-used -- backend valida via trustHosts (APP_URL)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserva o esquema original (https vindo do Cloudflare); cai pra $scheme no acesso LAN.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /sanctum {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host; # nosemgrep: request-host-used -- backend valida via trustHosts (APP_URL)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Servidor MCP (streamable HTTP) + OAuth do Passport + discovery.
    # /mcp usa resposta em streaming: buffering desligado.
    location /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host; # nosemgrep: request-host-used -- backend valida via trustHosts (APP_URL)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host; # nosemgrep: request-host-used -- backend valida via trustHosts (APP_URL)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /.well-known/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host; # nosemgrep: request-host-used -- backend valida via trustHosts (APP_URL)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
