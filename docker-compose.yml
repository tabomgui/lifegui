services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lifegui}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
      # Vaults Obsidian (um por usuário, {user_id}/). Fonte da verdade do
      # módulo Cérebro; na VM, apontar VAULTS_PATH_HOST pra pasta sincronizada.
      - ${VAULTS_PATH_HOST:-./vaults}:/vaults
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-lifegui}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      VAULTS_PATH: /vaults
    command: sh -c "composer install --no-interaction --prefer-dist && (grep -q '^APP_KEY=base64' .env || php artisan key:generate --force) && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
